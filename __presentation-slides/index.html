#### How Search Engines Work <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Overview of Search Engine Mechanisms <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Definition: The process of discovering new and updated content on the web <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* How It Works: Search engine bots (also called spiders or crawlers) follow links from one page to another to scan and collect data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Definition: The process of storing and organizing the content found during crawling in a massive database <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* How It Works: Once a page is crawled, it is analyzed and added to the search engine’s index, where it can be retrieved for relevant search queries <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Definition: The process of determining the order of search results based on relevance and quality <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* How It Works: Search engines use algorithms to evaluate indexed pages and rank them according to factors like content quality, backlinks, and user experience <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Search Crawlers Explained <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Discover Content: Crawlers start with a list of known URLs and follow links to find new pages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Scan Content: They analyze the text, images, videos, and other elements on a page <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Follow Links: Crawlers use internal and external links to discover additional pages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Indexing Process Overview <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Definition: The process of storing and organizing content so it can be retrieved quickly during a search query <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Exclusion: Pages with noindex tags or those blocked by robots.txt are not indexed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keywords: Search engines analyze the text on a page to identify relevant keywords <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Metadata: Title tags, meta descriptions, and headers are used to understand the page’s content <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Structured Data: Markup like schema.org helps search engines understand the context of the content <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Visibility: Only indexed pages can appear in search results <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### How Search Engine Algorithms Rank Pages <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Relevance: How well the content matches the user’s query <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Authority: The credibility and trustworthiness of the website (measured by backlinks and domain authority) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* User Experience: Page speed, mobile-friendliness, and ease of navigation <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Content Quality: Original, valuable, and well-structured content <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Purpose: Search engines frequently update their algorithms to improve the quality of search results <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Examples: Google’s Panda (content quality), Penguin (backlinks), and Core Updates (broad changes) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### The Impact of User Signals on Rankings <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Definition: The percentage of users who click on your link after seeing it in SERPs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Importance: A high CTR indicates that your title and meta description are compelling <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Definition: The percentage of users who leave your site after viewing only one page <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Importance: A high bounce rate may indicate that your content is not relevant or engaging <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Definition: The amount of time a user spends on your site after clicking through from SERPs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Importance: Longer dwell times suggest that users find your content valuable <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Differences Between Organic and Paid Results <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Definition: Organic results are unpaid listings that appear based on their relevance to the search query. They are determined by SEO efforts <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Appearance: Listed below paid ads on SERPs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Cost: Free (though SEO requires time and resources) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Control: Limited control over rankings; dependent on search engine algorithms <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Time to Results: Takes time to build rankings (weeks to months) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Sustainability: Long-term results if maintained properly <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Benefits of Organic Search for Long-Term Growth <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* No Direct Costs: Organic traffic is free, making it a cost-effective strategy in the long run <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Higher ROI: Over time, organic search delivers a higher return on investment compared to paid ads <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Perceived Authority: Users often trust organic results more than paid ads <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Brand Awareness: Consistent organic visibility increases brand recognition and recall <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Long-Term Results: Well-optimized websites can maintain rankings for years <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Less Dependency on Budget: Unlike PPC, organic traffic doesn’t rely on continuous spending <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Misconceptions About Organic vs. Paid Search <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Reality: While organic traffic is free, SEO requires significant time, effort, and often financial investment in tools, content creation, and technical optimization <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Reality: While PPC delivers immediate traffic, it stops driving results once the budget is exhausted. Organic search, though slower, provides sustainable traffic <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Reality: A blended strategy (combining SEO and PPC) often yields the best results, as they complement each other <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Reality: Rankings are important, but traffic and conversions depend on relevance, user intent, and the quality of the landing page <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Comparative ROI of SEO and PPC Campaigns <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Long-Term Focus: SEO delivers sustainable traffic over time <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Higher Lifetime Value: Organic traffic tends to have a higher lifetime value compared to paid traffic <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* Complementary strengths: SEO and PPC work best when used together. SEO provides long-term sustainability, while PPC delivers immediate results <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Different audiences and stages: SEO often captures users in the research phase, while PPC can target high-intent users ready to convert <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Data sharing: Insights from PPC campaigns (for example, high-performing keywords) can inform SEO strategies, and vice versa <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### The Early Days of Search Engines <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### First Generation Search Engines and Their Features <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Description: Archie is widely regarded as the first search engine. Created by Alan Emtage, it was designed to index FTP (File Transfer Protocol) archives <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Features: <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Indexed file names but not their contents <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Primarily used by academics and researchers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Operated via command-line interfaces <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Description: These search tools were developed to index Gopher files, a precursor to the modern web <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Key Milestones in Search Engine Technology <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* World Wide Web Wanderer: One of the first web crawlers, created to measure the growth of the web <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* JumpStation (1993): The first search engine to use a web crawler, index content, and provide search results based on keywords <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* WebCrawler (1994): The first search engine to index the full text of web pages, making it a significant leap forward in search technology <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Description: Founded by Jerry Yang and David Filo, Yahoo! started as a directory of websites organized by categories <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Features: <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Relied on human editors to categorize websites <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Transition from Directory Listings to Algorithm-Based Search <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* How It Worked: Websites were manually categorized and listed in directories like Yahoo! and DMOZ (Open Directory Project) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Limitations: <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Relied on human editors, making it difficult to scale as the web grew <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Limited search functionality, as users had to navigate through categories <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Automated Crawling and Indexing: Search engines like WebCrawler and AltaVista began using web crawlers to automatically index web pages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keyword-Based Ranking: Early algorithms ranked pages based on keyword frequency and placement <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Panda, Penguin, and Hummingbird: A Closer Look <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Purpose: Targeted low-quality content and thin websites <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Key Features: <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Penalized sites with duplicate, plagiarized, or shallow content <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Rewarded sites with high-quality, original, and valuable content <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Impact: <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Many content farms and low-quality sites saw significant drops in rankings <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* Purpose: Prioritized mobile-friendly websites in search results <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Key Features: <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Boosted rankings for sites optimized for mobile devices <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### How to Respond When an Algorithm Update Hits <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Adaptability: Algorithm updates force websites to adapt to new ranking factors; diagnose before rewriting everything <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Quality over volume: Thin content, manipulative links, and poor mobile experience are the patterns these updates targeted—and still punish <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Proactive monitoring: Watch Search Console, analytics, and crawl health so you can separate an update from a tracking or outage problem <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* User-centric recovery: Improve the weakest important URLs (content, links, and experience) rather than publishing random new posts to “recover.” <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### How Algorithm Updates Shaped SEO Best Practices <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Panda: Emphasized the need for high-quality, original content <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Best Practice: Focus on creating valuable, user-centric content <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Penguin: Highlighted the importance of natural, high-quality backlinks <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Best Practice: Avoid manipulative link-building tactics and focus on earning links organically <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Core Web Vitals: Prioritized page speed, interactivity, and visual stability <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Best Practice: Optimize for fast loading times and seamless user interactions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* Measures how quickly the page responds to clicks, taps, and key presses throughout the visit, not only the first input <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Target: INP should be less than 200 milliseconds <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Identifying and Disavowing Toxic Links <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Anchor Text Over-Optimization: Excessive exact-match or keyword-stuffed anchor text <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Link Farms or Private Blog Networks (PBNs): Links from known spam networks <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Unnatural Link Velocity: Sudden spikes in backlinks from dubious sources <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Writing Effective Robots.txt Files and Avoiding Common Mistakes <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Place robots.txt in the root directory (e.g., example.com/robots.txt) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use User-agent to specify crawlers (e.g., User-agent: Googlebot) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use Disallow to block sensitive directories (e.g., /admin/) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use Allow to override disallowed paths (e.g., Allow: /public/ in a blocked folder) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Blocking CSS/JS files (can hinder rendering) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Typos in directives (e.g., Disalow instead of Disallow) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

* Include only canonical URLs (no duplicates or blocked pages) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Limit sitemap size to 50,000 URLs or 50MB (split into multiple sitemaps if needed) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use , , and  tags (optional but helpful) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Google: Upload via Google Search Console (GSC) under "Sitemaps." <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Bing: Submit via Bing Webmaster Tools <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Why Local SEO is Crucial for Businesses <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Increased Visibility: Helps businesses appear in local searches, driving more foot traffic and online inquiries <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Targets High-Intent Customers: Local searches often lead to purchases (e.g., "near me" searches) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Competitive Advantage: Outranks competitors in local search results <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### The Role of Proximity, Relevance, and Prominence <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Proximity: How close a business is to the searcher's location. Google prioritizes nearby businesses <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Relevance: How well a business matches the user's search intent (e.g., services, keywords, and content) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Prominence: The business's reputation, reflected in reviews, citations, and backlinks <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Step-by-Step Guide to Verifying Your Business Listing <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Confirm the legal business name, service-area vs. storefront model, primary category, and NAP (name, address, phone) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use the same name customers would search for; do not stuff keywords into the business name <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Decide whether customers visit a street address. Service-area businesses (plumbers, consultants, mobile services) should hide the address if Google’s guidelines require it and define a service area instead <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Search Google for the business name and address. If a listing already exists, click Own this business? / Claim this listing <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If no listing exists, go to Google Business Profile and create one <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Choose the most accurate primary category (for example, “Dental clinic,” not “Company”). Add secondary categories only if they describe real services <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Optimizing Your Profile with Photos, Keywords, and Features <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Importance of NAP Consistency Across Platforms <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Search engines use citations as a trust and prominence signal for local pack rankings <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Users who find conflicting information may call the wrong number or visit the wrong address <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Inconsistent NAP makes merges and duplicate listings more likely <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Review sites and maps products often syndicate from a few major data providers; an error at the source can spread widely <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Name: Use the real-world business name. Match GBP <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Address: Follow USPS (or local postal) formatting. Include suite numbers the same way everywhere <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Top Tools for Managing Citations ([BrightLocal](https://www.brightlocal.com/), [Yext](https://www.yext.com/)) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Strengths: Local rank tracking, citation audits, reporting for agencies, and a citation-building workflow <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Best for: Small businesses and agencies that need audits plus ongoing reporting <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Typical use: Run a citation scan, fix NAP errors, then track local pack positions from map pins in the service area <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Strengths: Push business data out to a large publisher network from one dashboard <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Best for: Multi-location brands that need hours, menus, and holiday updates to propagate quickly <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Typical use: Treat Yext (or a similar listing-syndication platform) as the source of truth for NAP and hours, then monitor publishers for residual duplicates <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Correcting Duplicate and Inconsistent Listings <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Former owners, agencies, or directories created extra listings <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Address changes left the old location live <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Name variants (Riverside Dental vs. Riverside Family Dentistry LLC) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Franchise vs. corporate listings overlapping <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Inventory: Search the business name, old names, phone, and address on Google, Maps, Bing, Apple Maps, Yelp, and Facebook <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Choose the canonical listing: Usually the verified GBP with the correct NAP and most reviews <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Same Job, Different Clothes <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Why This Is Still SEO <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Google: optimizing for generative AI search is still SEO <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* RAG and query fan-out retrieve pages from the Search index, then generate with supporting links <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Chat products that search the live web still need a public URL they can fetch <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Vendor GEO packages: useful if they help you ship the work; ignore secret files and guaranteed citations <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Documentation Reference: Optimizing for generative AI features; third-party SEO advice <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Where People Find You Now <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Classic SERP: titles, local pack, ads <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Generated overview on the SERP: AI Overviews, AI Mode, Bing Copilot-style answers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Chatbots: ChatGPT, Gemini, Claude, Microsoft Copilot, Perplexity <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Voice, visual search, and browser/shopping agents <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* One site that is eligible, extractable, and trusted — plus measurement for clicks and citations <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### What Changed and What Did Not <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* More answers assembled on the results surface or in chat; some queries earn fewer clicks <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Query fan-out can retrieve several of your URLs — or several competitors’ URLs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Training crawlers and search crawlers are different bots <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Unchanged: crawlability, people-first content, E-E-A-T, Search Console plus conversions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Spam on a SERP is still spam when the output is a chatbot paragraph <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Decode the Acronyms <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### GEO, AEO, AIO, and LLMO <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* GEO (Generative Engine Optimization): be retrieved and cited inside generated answers <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* AEO (Answer Engine Optimization): be the passage an engine can lift; revived from featured snippets <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* AIO: usually Google AI Overviews; sometimes an umbrella for every AI surface — ask which <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* LLMO (Large Language Model Optimization): vendor label for what models say about you <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* AIEO, AISO, GAIO: same job with extra vowels <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### SXO, VEO, GIO, and AgEO <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* SXO: SEO plus on-site experience and conversion — already this book’s spine <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* VEO: spoken answers; same as Technical SEO voice work (ask if they meant video/visual instead) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* GIO: another vendor synonym for GEO/LLMO, not a Google ranking system <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* AgEO: agents that browse, compare, and complete tasks; semantic HTML and labeled inputs <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Documentation Reference: Build agent-friendly websites (web.dev) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Acronyms We Skip (and Why) <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* ASO (App Store Optimization): Apple App Store and Google Play, not the web index <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Different marketplace, different levers — not another SERP costume <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Skip any acronym whose only content is llms.txt plus guaranteed ChatGPT citations <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### The Shared Practice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Be Eligible to Be Retrieved <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Allowed in robots.txt for Googlebot; not blocked by the WAF <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Indexable and snippet-eligible (nosnippet is a deliberate choice) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Important content in HTML text; internal links can discover the URL <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Eligibility is necessary and never sufficient <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Documentation Reference: AI features and your website <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Write Extractable, Citable Answers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Direct answer near the question-style heading; then proof and exceptions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Specific entity statements beat “we care about quality” <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Non-commodity content: first-hand experience, original data, a real point of view <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Google: you do not need to shatter articles into micro-pages for models <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Documentation Reference: Creating helpful, reliable, people-first content <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Prove Experience, Entities, and Trust <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Named author with credentials that match the topic <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* First-hand language you can defend; facts attributed to a primary source <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Consistent brand name; GBP and Merchant Center when you are local or sell products <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* This is E-E-A-T and entity SEO; calling it LLMO does not change the checklist <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Earn Mentions the Web Already Believes <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Journalists, associations, genuine forum recommendations, unique datasets <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Skip write-for-us networks, identical guest posts, fake expert quotes <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Google warns against inauthentic mentions for generative features too <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Structured Data, Media, and Local Facts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* No special AI-Overview schema; llms.txt does not affect Google Search <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Keep schema.org that matches the visible page (Organization, Product, FAQ only if visible) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Images and video can surface in AI features — alt text, captions, transcripts still matter <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Stale hours and missing Merchant Center feeds show up in generated answers too <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Google AI Overviews and AI Mode <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### How Google Grounds Generative Answers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* AI Overviews appear when a generated gist adds something; they often do not trigger <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* AI Mode is the conversational, multi-step surface <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Query fan-out issues related searches, then grounds the response in retrieved pages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* This is RAG over the Search index, not a separate GEO index <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Eligibility Versus Inclusion <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Eligible: indexed, snippet-capable, policy-compliant, included in Search generative AI features <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Included: Google chose your URL as a supporting link — you cannot force that <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Preview controls: nosnippet, data-nosnippet, max-snippet, noindex <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Google-Extended does not change Search inclusion or ranking <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### What Google Says You Can Ignore <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* llms.txt and similar AI markdown files for Google Search <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Chunking content into tiny AI-only pages <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Rewriting every paragraph “for the model”; scaled-content spam still applies <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Buying inauthentic mentions; special AI schema as a secret handshake <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Measuring Generative AI in Search Console <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Generative AI performance report: impressions by page, country, device, date <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* AI Overviews and AI Mode also roll into the overall Web performance report <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Measure conversions in GA4, not only CTR <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* No third-party AI rank tracker has Google’s internal data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Documentation Reference: Generative AI performance report (Search) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

### Chatbots, Assistants, and Other Answer Engines <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### ChatGPT, Gemini, Copilot, Claude, and Perplexity <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Prompt money queries and brand queries the way a customer would <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Log date, wording, whether you were cited, competing URLs — quarterly <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* ChatGPT search: OAI-SearchBot; training: GPTBot <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Claude: Claude-SearchBot vs ClaudeBot vs Claude-User <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* PerplexityBot for search citations; Bingbot via Bing Webmaster Tools for Copilot <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Training Crawlers Versus Search Crawlers <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Search bots build the live answer index; blocking them usually means “do not cite me” <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Training bots may feed future weights; that is a licensing choice, not a Search ranking lever <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* User-initiated fetchers may not honor robots.txt the same way <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Google Search does not use GPTBot; Google-Extended does not change AI Overviews <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### robots.txt Decisions Without Panic <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Allow search crawlers for the products your customers use unless legal says otherwise <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Decide training crawlers separately and write the decision down <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Allow robots.txt itself; whitelist allowed bots on the WAF <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Optional llms.txt is fine for other systems; Google Search ignores it <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Confirm tokens on OpenAI, Perplexity, and Anthropic docs before you ship a file <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Voice, Visual, and Agent Surfaces <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### Voice and Visual as the Same Practice <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Voice: conversational FAQs, hours, entity facts a spoken answer can read — that is VEO <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Visual: unique images, alt text, product markup — same as Technical SEO image work <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Extractable two-sentence blocks are the script when a product reads aloud <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Preparing Pages for Browser Agents <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Real button and anchor elements; labeled inputs; stable layout (low CLS) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Avoid invisible overlays; keep critical content crawlable without a JS-only price <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Do not stuff ARIA to game agents; ARIA is for meaning <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Watch emerging commerce protocols; do not pause money-page SEO for every draft spec <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Documentation Reference: Build agent-friendly websites <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Leveraging [Search Console](https://search.google.com/search-console) for Indexing and Performance Insights <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Pages report: reasons URLs are not indexed (discovered–currently not indexed, crawled–currently not indexed, excluded by noindex, duplicate, 404) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Inspect URLs after publishing important pages; request indexing sparingly for new or updated URLs, not for the entire site daily <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

#### Best Practices for Using SEO Tools Efficiently <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Start with Google’s tools, then add a paid suite when you need competitors, backlinks, or scale <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### Recap of Key SEO Concepts <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

#### Overview of On-Page, Off-Page, and Technical SEO <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* On-page SEO is what you put on the page: content that matches intent, titles and headings, internal links, images, and HTML that clarifies the topic <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Off-page SEO is what the rest of the web says about you: backlinks, brand mentions, reviews, and citations. Quality beats volume <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Technical SEO is whether search engines can find, understand, and serve the site: crawlability, indexation, canonicalization, site architecture, speed, mobile usability, HTTPS, and structured data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Local SEO applies all three to a geographic market, with Google Business Profile and NAP consistency as extra pillars <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* AI answers apply all three to generated overviews and chatbots <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### AI Answers Belong in the Same Loop <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* GEO, AEO, AIO, LLMO, SXO, VEO, GIO, AgEO are costumes of the same loop <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Google: optimizing for generative AI features on Search is still SEO <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Chat products add crawler choices, not a second syllabus <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* ASO stays a different marketplace <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### Importance of Consistent SEO Strategy and Adaptation <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Set goals tied to the business (leads, sales, qualified traffic) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Build a map of keywords, pages, and responsibilities <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Work in cycles: research → implement → measure → refresh <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Adapt when algorithms, SERPs, or customer language change—without throwing away what already works <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Document so the strategy survives staff and vendor changes <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### The Role of Continuous Learning in SEO <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Follow primary sources: Google Search Central documentation and the Google Search Status Dashboard <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Read reputable industry reporting, then verify claims against your own Search Console data <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Revisit fundamentals after every hype cycle: crawl, index, intent, content quality, links, and UX <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Practice on a real site. Theory without implementation does not stick <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Learn adjacent skills: analytics, basic HTML, copywriting, and conversion-rate optimization <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

### How to Use This Book From Where You Are <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

---

#### If you are starting from zero <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Confirm the site is indexable (robots, sitemap, HTTPS, a usable mobile layout) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Install analytics and Search Console, and define at least one conversion <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Write or repair the pages that make money: home, primary services or products, contact <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* If customers search by city, claim and verify Google Business Profile and align NAP <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Publish only as much supporting content as you can keep accurate <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### If you already have traffic but few leads <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Map landing pages to intent. Informational blogs should not be the only URLs targeting transactional queries <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Fix titles and meta descriptions where impressions are high and CTR is low <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Improve the page experience and the form, phone, or checkout path <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Check that conversions are actually recorded <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### If you are local <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Treat Google Business Profile, reviews, and citations as core SEO, not as a side listing <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Build location pages only for places you truly serve, with proof that you work there <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Measure calls, direction requests, and booked jobs—not only website sessions <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### If you manage a large or messy site <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Inventory what is indexed vs. what you want indexed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Kill or consolidate thin, duplicate, and parameter URLs before adding more <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Use a crawler on a schedule, but validate “errors” against Google’s documentation and the live page <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Give developers reproducible tickets (URL, current behavior, expected behavior) <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->

---

#### If customers ask chatbots before they click <!-- .slide: data-transition="zoom" data-transition-speed="slow" -->

* Confirm search crawlers for those products are allowed <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Put a stand-alone answer under the question your customers actually type <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Check the Generative AI performance report and a small prompt log before you buy a GEO tool <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
* Details live in AI Answers and Generative Discovery; do not start a second playbook <!-- .element: class="fragment custom blur highlight-current-blue fade-up" -->
